<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Your Brand</title>

    <style>
      /* =========================
           RESET & BASE
        ========================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --background: #f5f7fb;
        --white: #ffffff;
      }

      body {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;

        min-height: 100vh;
        background:
          radial-gradient(circle at 10% 20%, #e0e7ff 0, transparent 30%),
          radial-gradient(circle at 90% 80%, #ddd6fe 0, transparent 30%),
          var(--background);

        color: var(--text);

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;
      }

      /* =========================
           MAIN CONTAINER
        ========================== */

      .login-container {
        width: 100%;
        max-width: 1050px;
        min-height: 650px;

        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 28px;

        overflow: hidden;

        display: grid;
        grid-template-columns: 1fr 1fr;

        box-shadow:
          0 25px 60px rgba(31, 41, 55, 0.12),
          0 8px 25px rgba(31, 41, 55, 0.06);

        backdrop-filter: blur(20px);

        animation: containerAppear 0.7s ease;
      }

      /* =========================
           LEFT SIDE
        ========================== */

      .visual-section {
        position: relative;

        padding: 55px;

        color: white;

        display: flex;
        flex-direction: column;
        justify-content: space-between;

        overflow: hidden;

        background: linear-gradient(145deg, #4f46e5, #6366f1 50%, #7c3aed);
      }

      /* Decorative circles */

      .visual-section::before,
      .visual-section::after {
        content: "";
        position: absolute;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.08);
      }

      .visual-section::before {
        width: 350px;
        height: 350px;

        top: -140px;
        right: -130px;
      }

      .visual-section::after {
        width: 300px;
        height: 300px;

        bottom: -130px;
        left: -120px;
      }

      .brand {
        position: relative;
        z-index: 2;

        display: flex;
        align-items: center;
        gap: 12px;

        font-size: 20px;
        font-weight: 700;
      }

      .brand-icon {
        width: 40px;
        height: 40px;

        border-radius: 12px;

        background: rgba(255, 255, 255, 0.18);

        display: grid;
        place-items: center;

        font-size: 20px;

        backdrop-filter: blur(10px);
      }

      .visual-content {
        position: relative;
        z-index: 2;

        max-width: 420px;
      }

      .visual-content h1 {
        font-size: clamp(36px, 4vw, 56px);
        line-height: 1.05;

        letter-spacing: -2px;

        margin-bottom: 22px;
      }

      .visual-content p {
        font-size: 16px;
        line-height: 1.7;

        color: rgba(255, 255, 255, 0.82);
      }

      .visual-footer {
        position: relative;
        z-index: 2;

        font-size: 13px;

        color: rgba(255, 255, 255, 0.65);
      }

      /* =========================
           FORM SECTION
        ========================== */

      .form-section {
        padding: 55px;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-form {
        width: 100%;
        max-width: 390px;
      }

      .form-header {
        margin-bottom: 35px;
      }

      .form-header h2 {
        font-size: 32px;
        letter-spacing: -0.8px;

        margin-bottom: 9px;
      }

      .form-header p {
        color: var(--muted);
        font-size: 15px;
      }

      /* =========================
           FORM GROUP
        ========================== */

      .form-group {
        margin-bottom: 21px;
      }

      .form-group label {
        display: block;

        font-size: 14px;
        font-weight: 600;

        margin-bottom: 8px;
      }

      .input-wrapper {
        position: relative;
      }

      .input-icon {
        position: absolute;

        left: 15px;
        top: 50%;

        transform: translateY(-50%);

        color: #9ca3af;

        font-size: 17px;

        pointer-events: none;
      }

      .form-group input {
        width: 100%;

        height: 52px;

        border: 1px solid var(--border);
        border-radius: 12px;

        padding: 0 15px 0 45px;

        outline: none;

        font-size: 15px;
        color: var(--text);

        background: #fafafa;

        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }

      .form-group input:focus {
        border-color: var(--primary);

        background: white;

        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
      }

      .form-group input::placeholder {
        color: #a1a1aa;
      }

      /* =========================
           PASSWORD TOGGLE
        ========================== */

      .password-toggle {
        position: absolute;

        right: 14px;
        top: 50%;

        transform: translateY(-50%);

        border: none;
        background: none;

        cursor: pointer;

        color: #9ca3af;

        font-size: 14px;
      }

      .password-toggle:hover {
        color: var(--primary);
      }

      /* =========================
           OPTIONS
        ========================== */

      .form-options {
        display: flex;
        align-items: center;
        justify-content: space-between;

        margin: 6px 0 25px;

        font-size: 13px;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 8px;

        color: var(--muted);

        cursor: pointer;
      }

      .remember input {
        width: 15px;
        height: 15px;

        accent-color: var(--primary);
      }

      .forgot-password {
        color: var(--primary);

        text-decoration: none;

        font-weight: 600;
      }

      .forgot-password:hover {
        text-decoration: underline;
      }

      /* =========================
           LOGIN BUTTON
        ========================== */

      .login-button {
        width: 100%;
        height: 52px;

        border: none;
        border-radius: 12px;

        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );

        color: white;

        font-size: 15px;
        font-weight: 700;

        cursor: pointer;

        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.22);

        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .login-button:hover {
        transform: translateY(-2px);

        box-shadow: 0 12px 25px rgba(79, 70, 229, 0.3);
      }

      .login-button:active {
        transform: translateY(0);
      }

      /* =========================
           DIVIDER
        ========================== */

      .divider {
        display: flex;
        align-items: center;
        gap: 14px;

        margin: 28px 0;
      }

      .divider::before,
      .divider::after {
        content: "";

        height: 1px;

        flex: 1;

        background: var(--border);
      }

      .divider span {
        color: #9ca3af;

        font-size: 12px;
      }

      /* =========================
           SOCIAL BUTTONS
        ========================== */

      .social-login {
        display: grid;
        grid-template-columns: 1fr 1fr;

        gap: 12px;
      }

      .social-button {
        height: 48px;

        border: 1px solid var(--border);
        border-radius: 11px;

        background: white;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;

        font-size: 14px;
        font-weight: 600;

        color: #374151;

        cursor: pointer;

        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          transform 0.2s ease;
      }

      .social-button:hover {
        background: #f9fafb;
        border-color: #d1d5db;

        transform: translateY(-1px);
      }

      .social-icon {
        font-size: 17px;
        font-weight: 700;
      }

      /* =========================
           SIGN UP
        ========================== */

      .signup {
        text-align: center;

        margin-top: 28px;

        font-size: 14px;

        color: var(--muted);
      }

      .signup a {
        color: var(--primary);

        font-weight: 700;

        text-decoration: none;
      }

      .signup a:hover {
        text-decoration: underline;
      }

      /* =========================
           ANIMATION
        ========================== */

      @keyframes containerAppear {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* =========================
           TABLET
        ========================== */

      @media (max-width: 850px) {
        .login-container {
          grid-template-columns: 1fr;
          max-width: 500px;
          min-height: auto;
        }

        .visual-section {
          min-height: 300px;

          padding: 35px;
        }

        .visual-content h1 {
          font-size: 38px;
        }

        .visual-footer {
          margin-top: 35px;
        }

        .form-section {
          padding: 40px 35px;
        }
      }

      /* =========================
           MOBILE
        ========================== */

      @media (max-width: 480px) {
        body {
          padding: 12px;
        }

        .login-container {
          border-radius: 20px;
        }

        .visual-section {
          min-height: 260px;

          padding: 28px;
        }

        .brand {
          font-size: 18px;
        }

        .brand-icon {
          width: 36px;
          height: 36px;
        }

        .visual-content h1 {
          font-size: 34px;

          letter-spacing: -1.5px;

          margin-bottom: 14px;
        }

        .visual-content p {
          font-size: 14px;
        }

        .visual-footer {
          font-size: 12px;
        }

        .form-section {
          padding: 32px 24px;
        }

        .form-header {
          margin-bottom: 28px;
        }

        .form-header h2 {
          font-size: 28px;
        }

        .social-login {
          grid-template-columns: 1fr;
        }
      }

      /* =========================
           VERY SMALL DEVICES
        ========================== */

      @media (max-width: 350px) {
        .form-section {
          padding: 28px 18px;
        }

        .visual-section {
          padding: 24px;
        }

        .form-options {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
        }
      }
    </style>
  </head>

  <body>
    <main class="login-container">
      <!-- LEFT / VISUAL SECTION -->
      <section class="visual-section">
        <div class="brand">
          <div class="brand-icon">✦</div>
          <span>YourBrand</span>
        </div>

        <div class="visual-content">
          <h1>Welcome<br />back.</h1>

          <p>
            Sign in to continue your journey and access everything you need from
            one simple place.
          </p>
        </div>

        <div class="visual-footer">© 2026 YourBrand. All rights reserved.</div>
      </section>

      <!-- RIGHT / LOGIN FORM -->
      <section class="form-section">
        <form class="login-form">
          <div class="form-header">
            <h2>Sign in</h2>

            <p>Enter your details to access your account.</p>
          </div>

          <!-- EMAIL -->
          <div class="form-group">
            <label for="email"> Email address </label>

            <div class="input-wrapper">
              <span class="input-icon">✉</span>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <!-- PASSWORD -->
          <div class="form-group">
            <label for="password"> Password </label>

            <div class="input-wrapper">
              <span class="input-icon">🔒</span>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword()"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
          </div>

          <!-- OPTIONS -->
          <div class="form-options">
            <label class="remember">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>

            <a href="#" class="forgot-password"> Forgot password? </a>
          </div>

          <!-- LOGIN -->
          <button type="submit" class="login-button">Sign in</button>

          <!-- DIVIDER -->
          <div class="divider">
            <span>OR CONTINUE WITH</span>
          </div>

          <!-- SOCIAL LOGIN -->
          <div class="social-login">
            <button type="button" class="social-button">
              <span class="social-icon">G</span>
              Google
            </button>

            <button type="button" class="social-button">
              <span class="social-icon"></span>
              Apple
            </button>
          </div>

          <!-- SIGN UP -->
          <div class="signup">
            Don't have an account?
            <a href="#"> Create account </a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
